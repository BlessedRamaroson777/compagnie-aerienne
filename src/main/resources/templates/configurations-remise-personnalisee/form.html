<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${configuration.id != null ? 'Modifier Configuration' : 'Nouvelle Configuration'}">Configuration Remise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-percent"></i> 
                        <span th:text="${configuration.id != null ? 'Modifier Configuration' : 'Nouvelle Configuration'}"></span>
                    </h1>
                    <a href="/configurations-remise-personnalisee" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                </div>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:utext="${warning}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Formulaire -->
                <form th:action="${configuration.id != null ? '/configurations-remise-personnalisee/update/' + configuration.id : '/configurations-remise-personnalisee/save'}" 
                      method="post" id="configForm">
                    
                    <!-- Section 1: Informations de base -->
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-info-circle"></i> Informations Générales
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="nom" class="form-label">Nom de la configuration <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nom" name="nom" 
                                           th:value="${configuration.nom}" required maxlength="200"
                                           placeholder="Ex: Remise Vacances d'été">
                                </div>
                                <div class="col-md-6">
                                    <label for="volProgrammeId" class="form-label">Vol Programmé <span class="text-danger">*</span></label>
                                    <select class="form-select" id="volProgrammeId" name="volProgrammeId" required>
                                        <option value="">-- Sélectionner un vol --</option>
                                        <option th:each="vp : ${volsProgrammes}" 
                                                th:value="${vp.id}"
                                                th:selected="${configuration.volProgramme != null && configuration.volProgramme.id == vp.id}"
                                                th:text="${vp.vol != null ? vp.vol.numeroVol : ''} + ' - ' + ${#temporals.format(vp.dateHeureDepart, 'dd/MM/yyyy HH:mm')} + ' (' + ${vp.avion != null ? vp.avion.codeAvion : ''} + ')'">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-8">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="2"
                                              th:text="${configuration.description}" maxlength="500"
                                              placeholder="Description optionnelle"></textarea>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Statut</label>
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input" type="checkbox" id="actif" name="actif" 
                                               th:checked="${configuration.actif != null ? configuration.actif : true}" value="true">
                                        <label class="form-check-label" for="actif">Configuration active</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Pourcentages par Catégorie et Classe -->
                    <div class="card mb-4">
                        <div class="card-header bg-success text-white">
                            <i class="bi bi-percent"></i> Pourcentages de Remise par Catégorie et Classe
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info mb-3">
                                <i class="bi bi-info-circle"></i> 
                                Entrez le pourcentage de remise pour chaque combinaison catégorie/classe. 
                                <strong>Prix final = Prix × (1 - % / 100)</strong>
                                <br><small>Laissez vide ou 0 pour ne pas appliquer de remise.</small>
                            </div>
                            
                            <input type="hidden" name="toutesLesClasses" value="true">
                            
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover">
                                    <thead class="table-dark">
                                        <tr>
                                            <th class="align-middle">Catégorie Passager</th>
                                            <th th:each="classe : ${classesSiege}" 
                                                th:text="${classe.libelle}"
                                                class="text-center">
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cat : ${categoriesPassager}">
                                            <td class="align-middle fw-bold" th:text="${cat.libelle}"></td>
                                            <td th:each="classe : ${classesSiege}" class="text-center">
                                                <div class="input-group input-group-sm">
                                                    <input type="number" class="form-control text-center" 
                                                           th:name="'pourcentage_' + ${cat.idCategoriePassager} + '_' + ${classe.id}"
                                                           min="0" max="100" step="0.01" 
                                                           placeholder="0"
                                                           style="max-width: 100px;">
                                                    <span class="input-group-text">%</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="mt-3">
                                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="applyToAll()">
                                    <i class="bi bi-arrow-repeat"></i> Appliquer une valeur à tous
                                </button>
                                <input type="number" id="valeurGlobale" class="form-control d-inline-block ms-2" 
                                       style="width: 100px;" min="0" max="100" step="0.01" placeholder="%">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mb-4">
                        <a href="/configurations-remise-personnalisee" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save"></i> 
                            <span th:text="${configuration.id != null ? 'Mettre à jour' : 'Créer la configuration'}"></span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function applyToAll() {
            const valeur = document.getElementById('valeurGlobale').value;
            if (valeur !== '') {
                document.querySelectorAll('input[name^="pourcentage_"]').forEach(input => {
                    input.value = valeur;
                });
            }
        }
    </script>
</body>
</html>
