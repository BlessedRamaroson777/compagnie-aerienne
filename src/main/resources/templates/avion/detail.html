<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3><i class="bi bi-airplane"></i> Détails de l'Avion</h3>
                    </div>
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">ID:</dt>
                            <dd class="col-sm-9" th:text="${avion.id}"></dd>
                            
                            <dt class="col-sm-3">Code Avion:</dt>
                            <dd class="col-sm-9" th:text="${avion.codeAvion}"></dd>
                            
                            <dt class="col-sm-3">Modèle:</dt>
                            <dd class="col-sm-9" th:text="${avion.modele}"></dd>
                            
                            <dt class="col-sm-3">Capacité Totale:</dt>
                            <dd class="col-sm-9" th:text="${avion.capaciteTotale}"></dd>
                            
                            <dt class="col-sm-3">Nombre de Sièges:</dt>
                            <dd class="col-sm-9" th:text="${avion.sieges.size()}"></dd>
                            
                            <dt class="col-sm-3">Nombre de Vols:</dt>
                            <dd class="col-sm-9" th:text="${avion.vols.size()}"></dd>
                        </dl>

                        <h5 class="mt-4">Sièges</h5>
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Numéro</th>
                                        <th>Classe</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="siege : ${avion.sieges}">
                                        <td th:text="${siege.numeroSiege}"></td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${siege.classeSiege == T(com.airline.airline_app.entity.enums.ClasseSiege).BUSINESS ? 'bg-warning' : 'bg-info'}"
                                                  th:text="${siege.classeSiege}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/avions}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Retour
                            </a>
                            <div>
                                <a th:href="@{/avions/{id}/edit(id=${avion.id})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <a th:href="@{/avions/{id}/delete(id=${avion.id})}" class="btn btn-danger" 
                                   onclick="return confirm('Êtes-vous sûr?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
