<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Avions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block bg-dark sidebar" style="min-height: 100vh;">
                <div class="pt-3">
                    <h4 class="text-white text-center mb-4">Airline System</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/}">
                                <i class="bi bi-house-door"></i> Accueil
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white bg-primary" th:href="@{/avions}">
                                <i class="bi bi-airplane"></i> Avions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/vols}">
                                <i class="bi bi-airplane-engines"></i> Vols
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/clients}">
                                <i class="bi bi-people"></i> Clients
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/reservations}">
                                <i class="bi bi-calendar-check"></i> Réservations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/equipages}">
                                <i class="bi bi-person-badge"></i> Équipage
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-airplane"></i> Gestion des Avions</h1>
                    <a th:href="@{/avions/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Nouvel Avion
                    </a>
                </div>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Filtres -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Filtres</h5>
                        <form th:action="@{/avions}" method="get" class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Code Avion</label>
                                <input type="text" name="codeAvion" class="form-control" th:value="${codeAvion}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Modèle</label>
                                <input type="text" name="modele" class="form-control" th:value="${modele}">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Capacité Min</label>
                                <input type="number" name="capaciteMin" class="form-control" th:value="${capaciteMin}">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Capacité Max</label>
                                <input type="number" name="capaciteMax" class="form-control" th:value="${capaciteMax}">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-search"></i> Filtrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Code Avion</th>
                                <th>Modèle</th>
                                <th>Capacité Totale</th>
                                <th>Nombre de Sièges</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="avion : ${avions}">
                                <td th:text="${avion.id}"></td>
                                <td th:text="${avion.codeAvion}"></td>
                                <td th:text="${avion.modele}"></td>
                                <td th:text="${avion.capaciteTotale}"></td>
                                <td th:text="${avion.sieges.size()}"></td>
                                <td>
                                    <a th:href="@{/avions/{id}(id=${avion.id})}" class="btn btn-sm btn-info">
                                        <i class="bi bi-eye"></i> Voir
                                    </a>
                                    <a th:href="@{/avions/{id}/edit(id=${avion.id})}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i> Modifier
                                    </a>
                                    <a th:href="@{/avions/{id}/delete(id=${avion.id})}" class="btn btn-sm btn-danger" 
                                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet avion?')">
                                        <i class="bi bi-trash"></i> Supprimer
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(avions)}">
                                <td colspan="6" class="text-center">Aucun avion trouvé</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
