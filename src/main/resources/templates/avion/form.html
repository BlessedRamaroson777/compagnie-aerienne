<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${avion.id != null ? 'Modifier Avion' : 'Nouvel Avion'}">Formulaire Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${avion.id != null ? 'Modifier Avion' : 'Nouvel Avion'}">Formulaire Avion</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/avions}" th:object="${avion}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="codeAvion" class="form-label">Code Avion *</label>
                                <input type="text" class="form-control" id="codeAvion" th:field="*{codeAvion}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="modelAvion" class="form-label">Modèle d'Avion *</label>
                                <select class="form-select" id="modelAvion" th:field="*{modelAvion}" required>
                                    <option value="">-- Sélectionner un modèle --</option>
                                    <option th:each="modele : ${modeles}" 
                                            th:value="${modele.id}" 
                                            th:text="${modele.designation + ' - ' + modele.fabricant}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="etatAvion" class="form-label">État de l'Avion *</label>
                                <select class="form-select" id="etatAvion" th:field="*{etatAvion}" required>
                                    <option value="">-- Sélectionner un état --</option>
                                    <option th:each="etat : ${etats}" 
                                            th:value="${etat.id}" 
                                            th:text="${etat.libelle}">
                                    </option>
                                </select>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h5 class="mb-0"><i class="bi bi-grid-3x3"></i> Configuration des Classes de Sièges *</h5>
                                    <small class="text-muted">Définissez le nombre de places pour chaque classe</small>
                                </div>
                                <div class="card-body">
                                    <div class="row" id="classesConfiguration">
                                        <div class="col-md-6 mb-3" th:each="classe : ${classes}">
                                            <div class="card h-100">
                                                <div class="card-body">
                                                    <h6 class="card-title" th:text="${classe.libelle}">Classe</h6>
                                                    <p class="card-text small text-muted" th:text="${classe.description}">Description</p>
                                                    <div class="input-group">
                                                        <span class="input-group-text"><i class="bi bi-people"></i></span>
                                                        <input type="number" 
                                                               class="form-control classe-input" 
                                                               th:name="'classe_' + ${classe.id}"
                                                               th:id="'classe_' + ${classe.id}"
                                                               value="0"
                                                               min="0" 
                                                               placeholder="Nombre de places"
                                                               oninput="updateTotalCapacity()">
                                                        <span class="input-group-text">places</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="alert alert-success mt-3" id="totalCapacityAlert">
                                        <i class="bi bi-calculator"></i> <strong>Capacité totale :</strong> <span id="totalCapacity">0</span> places
                                    </div>
                                    <div class="alert alert-danger mt-2 d-none" id="errorAlert">
                                        <i class="bi bi-exclamation-triangle"></i> <span id="errorMessage"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <input type="hidden" id="capaciteTotale" th:field="*{capaciteTotale}">
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/avions}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Retour
                                </a>
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTotalCapacity() {
            let total = 0;
            const inputs = document.querySelectorAll('.classe-input');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            inputs.forEach(input => {
                const value = parseInt(input.value) || 0;
                total += value;
            });
            
            document.getElementById('totalCapacity').textContent = total;
            const capaciteTotaleInput = document.getElementById('capaciteTotale');
            if (capaciteTotaleInput) {
                capaciteTotaleInput.value = total;
            }
            
            // Validation
            if (total === 0) {
                errorAlert.classList.remove('d-none');
                errorMessage.textContent = 'Vous devez configurer au moins une classe avec des places.';
                submitBtn.disabled = true;
            } else {
                errorAlert.classList.add('d-none');
                submitBtn.disabled = false;
            }
        }
        
        // Initialiser au chargement et débloquer le bouton si des valeurs existent
        document.addEventListener('DOMContentLoaded', function() {
            // Vérifier s'il y a déjà des valeurs (mode édition)
            const inputs = document.querySelectorAll('.classe-input');
            let hasValues = false;
            inputs.forEach(input => {
                if (parseInt(input.value) > 0) {
                    hasValues = true;
                }
            });
            
            // Si pas de valeurs, débloquer quand même le bouton pour permettre la saisie
            if (!hasValues) {
                document.getElementById('submitBtn').disabled = false;
            }
            
            updateTotalCapacity();
        });
    </script>
</body>
</html>
