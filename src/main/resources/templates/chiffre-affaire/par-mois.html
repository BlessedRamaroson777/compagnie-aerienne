<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CA par Mois</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    
    <style>
        .sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 20px;
        }
        .sortable:hover {
            background-color: #e9ecef;
        }
        .sortable::after {
            content: '\2195';
            position: absolute;
            right: 5px;
            opacity: 0.3;
            font-size: 0.8rem;
        }
        .sortable.asc::after {
            content: '\2191';
            opacity: 1;
            color: #0d6efd;
        }
        .sortable.desc::after {
            content: '\2193';
            opacity: 1;
            color: #0d6efd;
        }
        .filter-input {
            width: 100%;
            padding: 4px 6px;
            font-size: 0.8rem;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-calendar-month"></i> Chiffre d'affaires par mois - <span th:text="${annee}"></span></h1>
                    <div>
                        <a th:href="@{/chiffre-affaire/par-mois(annee=${annee - 1})}" class="btn btn-outline-secondary">
                            <i class="bi bi-chevron-left"></i> [[${annee - 1}]]
                        </a>
                        <a th:href="@{/chiffre-affaire/par-mois(annee=${annee + 1})}" class="btn btn-outline-secondary">
                            [[${annee + 1}]] <i class="bi bi-chevron-right"></i>
                        </a>
                    </div>
                </div>

                <!-- Filtre par mois -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">Filtrer par mois</label>
                                <select id="filterMois" class="form-select">
                                    <option value="">-- Tous les mois --</option>
                                    <option value="1">Janvier</option>
                                    <option value="2">Février</option>
                                    <option value="3">Mars</option>
                                    <option value="4">Avril</option>
                                    <option value="5">Mai</option>
                                    <option value="6">Juin</option>
                                    <option value="7">Juillet</option>
                                    <option value="8">Août</option>
                                    <option value="9">Septembre</option>
                                    <option value="10">Octobre</option>
                                    <option value="11">Novembre</option>
                                    <option value="12">Décembre</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="button" id="btnResetFilter" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> Réinitialiser
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-bg-success">
                            <div class="card-body">
                                <h6 class="card-title">Total Tickets</h6>
                                <h4 th:text="${#numbers.formatDecimal(totalTickets, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-primary">
                            <div class="card-body">
                                <h6 class="card-title">Total Diffusion</h6>
                                <h4 th:text="${#numbers.formatDecimal(totalDiffusion, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-info">
                            <div class="card-body">
                                <h6 class="card-title">Total Vente Produits</h6>
                                <h4 th:text="${#numbers.formatDecimal(totalVenteProduits, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-bg-dark">
                            <div class="card-body">
                                <h6 class="card-title">Total Général</h6>
                                <h4 th:text="${#numbers.formatDecimal(totalGeneral, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th class="sortable" data-type="number">Mois</th>
                                        <th class="sortable" data-type="text">Période</th>
                                        <th class="text-end sortable" data-type="number">Tickets (Ar)</th>
                                        <th class="text-end sortable" data-type="number">Diffusion Total (Ar)</th>
                                        <th class="text-end sortable" data-type="number">Diffusion Payée (Ar)</th>
                                        <th class="text-end sortable" data-type="number">Diffusion Reste (Ar)</th>
                                        <th class="text-end sortable" data-type="number">Vente Produits (Ar)</th>
                                        <th class="text-end sortable" data-type="number">Total (Ar)</th>
                                        <th class="text-center">Réservations</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ca : ${caList}">
                                        <td th:text="${ca.mois}"></td>
                                        <td th:text="${ca.moisLibelle}"></td>
                                        <td class="text-end text-success" th:text="${#numbers.formatDecimal(ca.montantTickets, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end text-primary" th:text="${#numbers.formatDecimal(ca.montantDiffusionTotal, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end text-success" th:text="${#numbers.formatDecimal(ca.montantDiffusionPaye, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end text-danger" th:text="${#numbers.formatDecimal(ca.montantDiffusionReste, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end text-info" th:text="${#numbers.formatDecimal(ca.montantVenteProduits, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(ca.montantTotal, 0, 'COMMA', 0, 'POINT')}"></td>
                                        <td class="text-center">
                                            <span class="badge bg-primary" th:text="${ca.nombreReservations}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <a href="/chiffre-affaire" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sortableHeaders = document.querySelectorAll('.sortable');
            const tbody = document.querySelector('tbody');
            const filterMois = document.getElementById('filterMois');
            const btnResetFilter = document.getElementById('btnResetFilter');
            
            // Filtre par mois
            filterMois.addEventListener('change', function() {
                const selectedMois = this.value;
                const rows = tbody.querySelectorAll('tr');
                
                rows.forEach(row => {
                    const moisCell = row.cells[0].textContent.trim();
                    if (selectedMois === '' || moisCell === selectedMois) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
                
                updateTotals();
            });
            
            // Réinitialiser le filtre
            btnResetFilter.addEventListener('click', function() {
                filterMois.value = '';
                const rows = tbody.querySelectorAll('tr');
                rows.forEach(row => row.style.display = '');
                updateTotals();
            });
            
            // Mettre à jour les totaux visibles
            function updateTotals() {
                const visibleRows = Array.from(tbody.querySelectorAll('tr')).filter(row => row.style.display !== 'none');
                
                let totalTickets = 0, totalDiffusion = 0, totalVenteProduits = 0, totalGeneral = 0;
                
                visibleRows.forEach(row => {
                    totalTickets += parseFloat(row.cells[2].textContent.replace(/[^\d.-]/g, '')) || 0;
                    totalDiffusion += parseFloat(row.cells[3].textContent.replace(/[^\d.-]/g, '')) || 0;
                    totalVenteProduits += parseFloat(row.cells[6].textContent.replace(/[^\d.-]/g, '')) || 0;
                    totalGeneral += parseFloat(row.cells[7].textContent.replace(/[^\d.-]/g, '')) || 0;
                });
                
                // Note: Les cards de totaux gardent les valeurs originales de l'année
            }
            
            // Tri des colonnes
            sortableHeaders.forEach(header => {
                header.addEventListener('click', function() {
                    const dataType = header.getAttribute('data-type');
                    const columnIndex = Array.from(header.parentElement.children).indexOf(header);
                    const currentOrder = header.classList.contains('asc') ? 'asc' : 'desc';
                    const newOrder = currentOrder === 'asc' ? 'desc' : 'asc';
                    
                    sortableHeaders.forEach(h => h.classList.remove('asc', 'desc'));
                    header.classList.add(newOrder);
                    
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        let aVal = a.cells[columnIndex].textContent.trim();
                        let bVal = b.cells[columnIndex].textContent.trim();
                        
                        if (dataType === 'number') {
                            aVal = parseFloat(aVal.replace(/[^\d.-]/g, '')) || 0;
                            bVal = parseFloat(bVal.replace(/[^\d.-]/g, '')) || 0;
                        }
                        
                        if (aVal < bVal) return newOrder === 'asc' ? -1 : 1;
                        if (aVal > bVal) return newOrder === 'asc' ? 1 : -1;
                        return 0;
                    });
                    
                    rows.forEach(row => tbody.appendChild(row));
                });
            });
        });
    </script>
</body>
</html>
