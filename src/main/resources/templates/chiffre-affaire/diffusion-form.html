<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Diffusion - Sélection</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- TON CSS EXACT -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar EXACTEMENT COMME PAGE 1 -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="col-md-10 ms-sm-auto px-md-4">
            <div class="container-fluid py-4">

                <!-- Header -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-broadcast-tower"></i>
                        Chiffre d'Affaires – Diffusion
                    </h1>

                    <a th:href="@{/chiffre-affaire}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                </div>

                <!-- Carte formulaire -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-calendar-month"></i>
                            Sélection de la période
                        </h5>
                    </div>

                    <div class="card-body">
                        <form id="caForm">

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="mois" class="form-label">Mois</label>
                                    <select id="mois" class="form-select" required>
                                        <option value="1">Janvier</option>
                                        <option value="2">Février</option>
                                        <option value="3">Mars</option>
                                        <option value="4">Avril</option>
                                        <option value="5">Mai</option>
                                        <option value="6">Juin</option>
                                        <option value="7">Juillet</option>
                                        <option value="8">Août</option>
                                        <option value="9">Septembre</option>
                                        <option value="10">Octobre</option>
                                        <option value="11">Novembre</option>
                                        <option value="12">Décembre</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="annee" class="form-label">Année</label>
                                    <input type="number"
                                           id="annee"
                                           class="form-control"
                                           th:value="${anneeActuelle}"
                                           min="2020"
                                           max="2030"
                                           required>
                                </div>
                            </div>

                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i>
                                Choisissez un mois et une année pour afficher le chiffre d'affaires.
                            </div>

                            <div class="d-flex justify-content-center gap-2 mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search"></i> Consulter
                                </button>

                                <a th:href="@{/chiffre-affaire}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Annuler
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    document.getElementById('mois').value = [[${moisActuel}]];

    document.getElementById('caForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const mois = document.getElementById('mois').value;
        const annee = document.getElementById('annee').value;
        window.location.href = '/chiffre-affaire/diffusion/' + mois + '/' + annee;
    });
</script>

</body>
</html>
