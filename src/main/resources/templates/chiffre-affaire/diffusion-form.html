<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>CA Diffusion - Sélection</title>
    <th:block layout:fragment="extra-css">
        <link rel="stylesheet" th:href="@{/css/custom.css}">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-chart-line me-2"></i>
                            Chiffre d'Affaires des Diffusions par Mois
                        </h4>
                    </div>
                    <div class="card-body">
                        <form id="caForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="mois" class="form-label">Mois</label>
                                        <select id="mois" class="form-select" required>
                                            <option value="1">Janvier</option>
                                            <option value="2">Février</option>
                                            <option value="3">Mars</option>
                                            <option value="4">Avril</option>
                                            <option value="5">Mai</option>
                                            <option value="6">Juin</option>
                                            <option value="7">Juillet</option>
                                            <option value="8">Août</option>
                                            <option value="9">Septembre</option>
                                            <option value="10">Octobre</option>
                                            <option value="11">Novembre</option>
                                            <option value="12">Décembre</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="annee" class="form-label">Année</label>
                                        <input type="number" id="annee" class="form-control" 
                                               th:value="${anneeActuelle}" min="2020" max="2030" required>
                                    </div>
                                </div>
                            </div>
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-search me-2"></i>
                                    Consulter le CA
                                </button>
                                <a th:href="@{/chiffre-affaire}" class="btn btn-secondary btn-lg">
                                    <i class="fas fa-arrow-left me-2"></i>
                                    Retour
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        document.getElementById('mois').value = [[${moisActuel}]];
        
        document.getElementById('caForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const mois = document.getElementById('mois').value;
            const annee = document.getElementById('annee').value;
            window.location.href = '/chiffre-affaire/diffusion/' + mois + '/' + annee;
        });
    </script>
</div>
</body>
</html>
