<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiements Diffusion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <div class="main-content-with-sidebar">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-cash-stack"></i> Paiements Diffusion</h1>
                <a th:href="@{/paiement-diffusion/form}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouveau paiement
                </a>
            </div>

            <!-- Alertes -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Diffusion</th>
                                    <th>Société</th>
                                    <th>Montant Payé</th>
                                    <th>Date Paiement</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(paiements)}">
                                    <td colspan="6" class="text-center text-muted">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        Aucun paiement enregistré
                                    </td>
                                </tr>
                                <tr th:each="paiement : ${paiements}">
                                    <td th:text="${paiement.idPaiementDiffusion}"></td>
                                    <td th:text="${paiement.diffusionSociete?.idDiffusionSociete}"></td>
                                    <td th:text="${paiement.diffusionSociete?.societe?.libelle}"></td>
                                    <td th:text="${#numbers.formatDecimal(paiement.montantPaye, 1, 2) + ' Ar'}"></td>
                                    <td th:text="${#temporals.format(paiement.datePaiement, 'dd/MM/yyyy')}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/paiement-diffusion/detail/{id}(id=${paiement.idPaiementDiffusion})}" 
                                           class="btn btn-sm btn-outline-info" title="Détails">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/paiement-diffusion/form/{id}(id=${paiement.idPaiementDiffusion})}" 
                                           class="btn btn-sm btn-outline-primary" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/paiement-diffusion/delete/{id}(id=${paiement.idPaiementDiffusion})}" 
                                           class="btn btn-sm btn-outline-danger" title="Supprimer"
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce paiement ?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
