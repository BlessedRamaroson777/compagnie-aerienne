<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${paiement.id != null ? 'Modifier Paiement' : 'Nouveau Paiement'}">Formulaire Paiement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${paiement.id != null ? 'Modifier Paiement' : 'Nouveau Paiement'}">Formulaire Paiement</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/paiements}" th:object="${paiement}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="reservationId" class="form-label">Réservation *</label>
                                <select class="form-select" id="reservationId" name="reservationId" required>
                                    <option value="">Sélectionnez une réservation</option>
                                    <option th:each="reservation : ${reservations}" 
                                            th:value="${reservation.id}"
                                            th:text="${'#' + reservation.id + ' - ' + reservation.client.nom + ' ' + reservation.client.prenom + ' - Vol ' + reservation.vol.numeroVol}"
                                            th:selected="${paiement.reservation != null && paiement.reservation.id == reservation.id}"></option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="montant" class="form-label">Montant (€) *</label>
                                <input type="number" step="0.01" class="form-control" id="montant" th:field="*{montant}" required min="0">
                            </div>
                            
                            <div class="mb-3">
                                <label for="statut" class="form-label">Statut *</label>
                                <select class="form-select" id="statut" th:field="*{statut}" required>
                                    <option th:each="s : ${statuts}" 
                                            th:value="${s}"
                                            th:text="${s}"></option>
                                </select>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/paiements}" class="btn btn-secondary">Retour</a>
                                <button type="submit" class="btn btn-primary">Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
