<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Paiement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h3><i class="bi bi-credit-card"></i> Détails Paiement</h3>
                        <a th:href="@{/paiements}" class="btn btn-light btn-sm">Retour</a>
                    </div>
                    <div class="card-body" th:if="${paiement != null}">
                        <dl class="row">
                            <dt class="col-sm-4">ID:</dt>
                            <dd class="col-sm-8" th:text="${paiement.id}"></dd>
                            
                            <dt class="col-sm-4">Réservation:</dt>
                            <dd class="col-sm-8">
                                <a th:href="@{/reservations/{id}(id=${paiement.reservation.id})}" 
                                   th:text="${'#' + paiement.reservation.id}"></a>
                            </dd>
                            
                            <dt class="col-sm-4">Client:</dt>
                            <dd class="col-sm-8" th:text="${paiement.reservation.client.nom + ' ' + paiement.reservation.client.prenom}"></dd>
                            
                            <dt class="col-sm-4">Montant:</dt>
                            <dd class="col-sm-8" th:text="${paiement.montant + ' Ar'}"></dd>
                            
                            <dt class="col-sm-4">Date Paiement:</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(paiement.datePaiement, 'dd/MM/yyyy HH:mm')}"></dd>
                            
                            <dt class="col-sm-4">Statut:</dt>
                            <dd class="col-sm-8">
                                <span class="badge" 
                                      th:classappend="${paiement.statut == T(com.airline.airline_app.entity.enums.StatutPaiement).VALIDE ? 'bg-success' : (paiement.statut == T(com.airline.airline_app.entity.enums.StatutPaiement).REFUSE ? 'bg-danger' : 'bg-warning')}"
                                      th:text="${paiement.statut}"></span>
                            </dd>
                        </dl>
                        
                        <div class="mt-4">
                            <a th:href="@{/paiements/{id}/edit(id=${paiement.id})}" class="btn btn-secondary">
                                <i class="bi bi-pencil"></i> Modifier
                            </a>
                        </div>
                    </div>
                    <div class="card-body" th:if="${error != null}">
                        <div class="alert alert-danger" th:text="${error}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
