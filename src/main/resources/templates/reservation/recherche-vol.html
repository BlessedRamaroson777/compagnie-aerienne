<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechercher un Vol - Airline App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-blue: #1e40af;
            --light-blue: #dbeafe;
            --lighter-blue: #eff6ff;
        }
        body {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            min-height: 100vh;
        }
        .search-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            max-width: 750px;
            margin: 0 auto;
        }
        .form-select, .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem var(--light-blue);
        }
        .btn-search {
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-search:hover {
            background: linear-gradient(135deg, var(--dark-blue), #1e3a8a);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        .info-icon {
            width: 60px;
            height: 60px;
            background: var(--lighter-blue);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .info-icon i {
            font-size: 1.8rem;
            color: var(--primary-blue);
        }
        .navbar {
            background: white !important;
        }
        .navbar-brand, .nav-link {
            color: var(--dark-blue) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-airplane-fill me-2"></i>Airline App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Accueil</a>
                <a class="nav-link" href="/reservations"><i class="bi bi-list me-1"></i>Mes Réservations</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center text-white mb-5">
            <h1 class="display-4 fw-bold"><i class="bi bi-search me-3"></i>Rechercher un Vol</h1>
            <p class="lead">Trouvez le vol parfait pour votre voyage</p>
        </div>

        <div class="search-card">
            <form th:action="@{/reservations/vols-disponibles}" method="get">
                <div class="row g-4">
                    <!-- Départ -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="bi bi-geo-alt-fill text-primary me-2"></i>Ville de départ
                        </label>
                        <select name="aeroportDepartId" class="form-select" required>
                            <option value="">Sélectionner un aéroport</option>
                            <option th:each="aeroport : ${aeroports}" 
                                    th:value="${aeroport.id}"
                                    th:text="${aeroport.codeAeroport + ' - ' + aeroport.ville + ', ' + aeroport.pays}">
                            </option>
                        </select>
                    </div>

                    <!-- Arrivée -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="bi bi-geo-fill text-danger me-2"></i>Ville d'arrivée
                        </label>
                        <select name="aeroportArriveeId" class="form-select" required>
                            <option value="">Sélectionner un aéroport</option>
                            <option th:each="aeroport : ${aeroports}" 
                                    th:value="${aeroport.id}"
                                    th:text="${aeroport.codeAeroport + ' - ' + aeroport.ville + ', ' + aeroport.pays}">
                            </option>
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="bi bi-calendar-event text-success me-2"></i>Date de départ
                        </label>
                        <input type="date" name="dateVol" class="form-control" required 
                               th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>

                    <!-- Heure (Optionnel) -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="bi bi-clock text-info me-2"></i>Heure de départ (optionnel)
                        </label>
                        <input type="time" name="heureVol" class="form-control">
                        <small class="text-muted">Laissez vide pour voir tous les vols de la journée</small>
                    </div>

                    <!-- Bouton -->
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-search">
                            <i class="bi bi-search me-2"></i>Rechercher des vols
                        </button>
                    </div>
                </div>
            </form>

            <!-- Infos -->
            <div class="row mt-5 text-center">
                <div class="col-4">
                    <div class="info-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <p class="mb-0 small text-muted fw-bold">Paiement sécurisé</p>
                </div>
                <div class="col-4">
                    <div class="info-icon">
                        <i class="bi bi-clock-history"></i>
                    </div>
                    <p class="mb-0 small text-muted fw-bold">Confirmation instantanée</p>
                </div>
                <div class="col-4">
                    <div class="info-icon">
                        <i class="bi bi-headset"></i>
                    </div>
                    <p class="mb-0 small text-muted fw-bold">Support 24/7</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
