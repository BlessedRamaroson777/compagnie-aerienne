<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Formulaire Société</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-building me-2"></i><span th:text="${societe.idSociete != null ? 'Modifier' : 'Nouvelle'} + ' Société'"></span></h4>
            </div>
            <div class="card-body">
                <form th:action="@{/societe/save}" th:object="${societe}" method="post">
                    <input type="hidden" th:field="*{idSociete}">
                    <div class="mb-3">
                        <label class="form-label">Libellé</label>
                        <input type="text" th:field="*{libelle}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Enregistrer</button>
                    <a th:href="@{/societe}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
