<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Détail Société</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-building me-2"></i>Détail de la Société</h4>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <tr><th width="30%">ID</th><td th:text="${societe.idSociete}"></td></tr>
                    <tr><th>Libellé</th><td th:text="${societe.libelle}"></td></tr>
                </table>
                <a th:href="@{/societe}" class="btn btn-secondary mt-3"><i class="fas fa-arrow-left me-2"></i>Retour</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
