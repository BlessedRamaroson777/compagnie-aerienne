<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Sociétés</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-building me-2"></i>Liste des Sociétés</h4>
                <a th:href="@{/societe/form}" class="btn btn-light"><i class="fas fa-plus me-2"></i>Nouvelle Société</a>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr><th>ID</th><th>Libellé</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="societe : ${societes}">
                            <td th:text="${societe.idSociete}"></td>
                            <td th:text="${societe.libelle}"></td>
                            <td>
                                <a th:href="@{/societe/detail/{id}(id=${societe.idSociete})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
                                <a th:href="@{/societe/form/{id}(id=${societe.idSociete})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/societe/delete/{id}(id=${societe.idSociete})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmer la suppression?')"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
