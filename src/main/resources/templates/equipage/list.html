<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Équipage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <div class="main-content-with-sidebar">
        <div class="container-fluid py-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-4">
            <h2><i class="bi bi-person-badge me-2"></i>Gestion de l'Équipage</h2>
            <a th:href="@{/equipages/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nouveau Membre</a>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filtres</h5>
                <form th:action="@{/equipages}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="nom" class="form-control" th:value="${nom}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" name="prenom" class="form-control" th:value="${prenom}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Rôle</label>
                        <select name="role" class="form-select">
                            <option value="">Tous</option>
                            <option th:each="r : ${roles}" 
                                    th:value="${r.libelle}"
                                    th:text="${r.libelle}"
                                    th:selected="${role != null && role == r}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Filtrer</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Rôle</th>
                                <th>Vols Assignés</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="equipage : ${equipages}">
                                <td th:text="${equipage.id}"></td>
                                <td th:text="${equipage.nom}"></td>
                                <td th:text="${equipage.prenom}"></td>
                                <td>
                                    <span class="badge bg-info" th:text="${equipage.role != null ? equipage.role.libelle : 'N/A'}"></span>
                                </td>
                                <td>
                                    <div th:if="${equipage.vols != null && !equipage.vols.isEmpty()}">
                                        <div th:each="volEquipage, iterStat : ${equipage.vols}" 
                                             th:if="${iterStat.index < 3}"
                                             class="mb-1">
                                            <small>
                                                <span class="badge bg-secondary me-1" th:text="${volEquipage.volProgramme.vol.numeroVol}"></span>
                                                <span th:text="${volEquipage.volProgramme.vol.aeroportDepart.codeAeroport + ' → ' + volEquipage.volProgramme.vol.aeroportArrivee.codeAeroport}"></span>
                                                <br/>
                                                <span class="text-muted" th:text="${#temporals.format(volEquipage.volProgramme.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></span>
                                            </small>
                                        </div>
                                        <small class="text-muted" th:if="${equipage.vols.size() > 3}">
                                            +<span th:text="${equipage.vols.size() - 3}"></span> autres...
                                        </small>
                                    </div>
                                    <span th:if="${equipage.vols == null || equipage.vols.isEmpty()}" class="text-muted">
                                        <small>Aucun vol assigné</small>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/equipages/{id}(id=${equipage.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/equipages/{id}/edit(id=${equipage.id})}" class="btn btn-sm btn-secondary"><i class="bi bi-pencil"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(equipages)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox display-4"></i>
                                    <p class="mt-2">Aucun membre d'équipage trouvé</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
