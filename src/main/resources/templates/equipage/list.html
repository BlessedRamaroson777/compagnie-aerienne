<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste Équipage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block bg-dark sidebar" style="min-height: 100vh;">
                <div class="pt-3">
                    <h4 class="text-white text-center mb-4">Airline System</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link text-white" th:href="@{/}"><i class="bi bi-house-door"></i> Accueil</a></li>
                        <li class="nav-item"><a class="nav-link text-white" th:href="@{/avions}"><i class="bi bi-airplane"></i> Avions</a></li>
                        <li class="nav-item"><a class="nav-link text-white" th:href="@{/vols}"><i class="bi bi-airplane-engines"></i> Vols</a></li>
                        <li class="nav-item"><a class="nav-link text-white" th:href="@{/clients}"><i class="bi bi-people"></i> Clients</a></li>
                        <li class="nav-item"><a class="nav-link text-white" th:href="@{/reservations}"><i class="bi bi-calendar-check"></i> Réservations</a></li>
                        <li class="nav-item"><a class="nav-link text-white bg-primary" th:href="@{/equipages}"><i class="bi bi-person-badge"></i> Équipage</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-person-badge"></i> Gestion de l'Équipage</h1>
                    <a th:href="@{/equipages/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nouveau Membre</a>
                </div>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Filtres</h5>
                        <form th:action="@{/equipages}" method="get" class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" th:value="${nom}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" th:value="${prenom}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Rôle</label>
                                <select name="role" class="form-select">
                                    <option value="">Tous</option>
                                    <option th:each="r : ${roles}" 
                                            th:value="${r}"
                                            th:text="${r}"
                                            th:selected="${role != null && role == r}"></option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> Filtrer</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Rôle</th>
                                <th>Vols Assignés</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="equipage : ${equipages}">
                                <td th:text="${equipage.id}"></td>
                                <td th:text="${equipage.nom}"></td>
                                <td th:text="${equipage.prenom}"></td>
                                <td>
                                    <span class="badge bg-info" th:text="${equipage.role}"></span>
                                </td>
                                <td th:text="${equipage.vols.size()}"></td>
                                <td>
                                    <a th:href="@{/equipages/{id}(id=${equipage.id})}" class="btn btn-sm btn-info"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{/equipages/{id}/edit(id=${equipage.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/equipages/{id}/delete(id=${equipage.id})}" class="btn btn-sm btn-danger" 
                                       onclick="return confirm('Supprimer?')"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(equipages)}">
                                <td colspan="6" class="text-center">Aucun membre d'équipage trouvé</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
