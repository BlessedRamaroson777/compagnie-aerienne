<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail Équipage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3><i class="bi bi-person-badge"></i> Détails du Membre d'Équipage</h3>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${equipage.id}"></dd>
                    
                    <dt class="col-sm-3">Nom:</dt>
                    <dd class="col-sm-9" th:text="${equipage.nom}"></dd>
                    
                    <dt class="col-sm-3">Prénom:</dt>
                    <dd class="col-sm-9" th:text="${equipage.prenom}"></dd>
                    
                    <dt class="col-sm-3">Rôle:</dt>
                    <dd class="col-sm-9">
                        <span class="badge bg-info" th:text="${equipage.role}"></span>
                    </dd>
                </dl>

                <h5 class="mt-4">Vols Assignés (<span th:text="${equipage.vols.size()}"></span>)</h5>
                <div class="table-responsive" th:if="${!#lists.isEmpty(equipage.vols)}">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Numéro Vol</th>
                                <th>Trajet</th>
                                <th>Date Départ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="volEquipage : ${equipage.vols}">
                                <td th:text="${volEquipage.vol.numeroVol}"></td>
                                <td th:text="${volEquipage.vol.depart + ' → ' + volEquipage.vol.arrivee}"></td>
                                <td th:text="${#temporals.format(volEquipage.vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(equipage.vols)}" class="alert alert-info">
                    Aucun vol assigné
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/equipages}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                    <div>
                        <a th:href="@{/equipages/{id}/edit(id=${equipage.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Modifier
                        </a>
                        <a th:href="@{/equipages/{id}/delete(id=${equipage.id})}" class="btn btn-danger" 
                           onclick="return confirm('Supprimer ce membre?')">
                            <i class="bi bi-trash"></i> Supprimer
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
