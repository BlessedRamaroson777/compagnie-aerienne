<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${etatAvion.id != null ? 'Modifier État' : 'Nouvel État'}">État Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${etatAvion.id != null ? 'Modifier État Avion' : 'Nouvel État Avion'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${etatAvion.id != null ? '/etats-avion/' + etatAvion.id : '/etats-avion'}}" 
                              th:object="${etatAvion}" method="post">
                            
                            <div class="mb-3">
                                <label for="libelle" class="form-label">Libellé *</label>
                                <input type="text" class="form-control" id="libelle" th:field="*{libelle}" required>
                                <div class="form-text">Ex: OPERATIONNEL, EN_MAINTENANCE, HORS_SERVICE, EN_REVISION</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/etats-avion}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Retour
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
