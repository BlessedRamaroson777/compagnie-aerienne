<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Configuration Coût</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-dollar-sign me-2"></i>Configuration Coût Diffusion</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/configuration-cout-diffusion/save}" th:object="${configuration}" method="post">
                    <input type="hidden" th:field="*{idConfigurationCoutDiffusion}">
                    <div class="mb-3">
                        <label class="form-label">Diffusion Société</label>
                        <select name="diffusionSocieteId" class="form-select" required>
                            <option value="">Sélectionner...</option>
                            <option th:each="diff : ${diffusions}" th:value="${diff.idDiffusionSociete}" 
                                    th:text="${diff.societe?.libelle + ' - ' + diff.nombre + ' (' + #temporals.format(diff.date, 'dd/MM/yyyy') + ')'}"
                                    th:selected="${configuration.diffusionSociete != null && configuration.diffusionSociete.idDiffusionSociete == diff.idDiffusionSociete}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prix (Ar)</label>
                        <input type="number" step="0.01" th:field="*{prix}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Enregistrer</button>
                    <a th:href="@{/configuration-cout-diffusion}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
