<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${configuration.idConfigurationCoutDiffusion != null ? 'Modifier configuration' : 'Nouvelle configuration'}">Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <div class="main-content-with-sidebar">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-currency-dollar"></i> 
                    <span th:text="${configuration.idConfigurationCoutDiffusion != null ? 'Modifier configuration' : 'Nouvelle configuration'}">Configuration</span>
                </h1>
                <a th:href="@{/configuration-cout-diffusion}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/configuration-cout-diffusion/save}" th:object="${configuration}" method="post">
                                <input type="hidden" th:field="*{idConfigurationCoutDiffusion}" />
                                
                                <div class="mb-3">
                                    <label for="diffusionSociete" class="form-label">Diffusion Société *</label>
                                    <select class="form-select" id="diffusionSociete" name="diffusionSocieteId" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="d : ${diffusions}" 
                                                th:value="${d.idDiffusionSociete}" 
                                                th:text="${'ID: ' + d.idDiffusionSociete + ' - ' + d.societe?.libelle}"
                                                th:selected="${configuration.diffusionSociete != null and d.idDiffusionSociete == configuration.diffusionSociete.idDiffusionSociete}">
                                        </option>
                                    </select>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="prix" class="form-label">Prix (Ar) *</label>
                                    <input type="number" step="0.01" class="form-control" id="prix" th:field="*{prix}" 
                                           required min="0" placeholder="Ex: 10.50">
                                </div>
                                
                                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                    <a th:href="@{/configuration-cout-diffusion}" class="btn btn-secondary">
                                        <i class="bi bi-x-circle"></i> Annuler
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle"></i> Enregistrer
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
