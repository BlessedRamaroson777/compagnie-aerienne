<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            <main class="col-md-10 ms-sm-auto px-md-4">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-currency-dollar"></i> Détail Configuration</h1>
                <div>
                    <a th:href="@{/configuration-cout-diffusion}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                    <a th:href="@{/configuration-cout-diffusion/form/{id}(id=${config.idConfigurationCoutDiffusion})}" class="btn btn-primary">
                        <i class="bi bi-pencil"></i> Modifier
                    </a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-bordered">
                                <tr>
                                    <th width="30%">ID</th>
                                    <td th:text="${config.idConfigurationCoutDiffusion}"></td>
                                </tr>
                                <tr>
                                    <th>Diffusion Société</th>
                                    <td th:text="${config.diffusionSociete?.idDiffusionSociete}"></td>
                                </tr>
                                <tr>
                                    <th>Société</th>
                                    <td th:text="${config.diffusionSociete?.societe?.libelle}"></td>
                                </tr>
                                <tr>
                                    <th>Prix</th>
                                    <td th:text="${#numbers.formatDecimal(config.prix, 1, 2) + ' Ar'}"></td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
