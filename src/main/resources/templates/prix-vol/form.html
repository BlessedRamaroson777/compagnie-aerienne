<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${prixVol.id != null ? 'Modifier Prix Vol' : 'Nouveau Prix Vol'}">Prix Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${prixVol.id != null ? 'Modifier Prix Vol' : 'Nouveau Prix Vol'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${prixVol.id != null ? '/prix-vol/' + prixVol.id : '/prix-vol'}}" 
                              th:object="${prixVol}" method="post">
                            
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i> Définir le prix d'un vol pour une classe de siège spécifique
                            </div>

                            <div class="mb-3">
                                <label for="volId" class="form-label">Vol *</label>
                                <select class="form-select" id="volId" name="volId" required>
                                    <option value="">-- Sélectionner un vol --</option>
                                    <option th:each="vol : ${vols}" 
                                            th:value="${vol.id}"
                                            th:selected="${prixVol.vol != null && prixVol.vol.id == vol.id}"
                                            th:text="${vol.numeroVol + ' - ' + vol.aeroportDepart.codeAeroport + ' → ' + vol.aeroportArrivee.codeAeroport + ' (' + #temporals.format(vol.dateHeureDepart, 'dd/MM/yyyy HH:mm') + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="classeSiegeId" class="form-label">Classe de Siège *</label>
                                <select class="form-select" id="classeSiegeId" name="classeSiegeId" required>
                                    <option value="">-- Sélectionner une classe --</option>
                                    <option th:each="classe : ${classeSieges}" 
                                            th:value="${classe.id}"
                                            th:selected="${prixVol.classeSiege != null && prixVol.classeSiege.id == classe.id}"
                                            th:text="${classe.libelle}">
                                    </option>
                                </select>
                                <div class="form-text">Chaque combinaison Vol + Classe doit être unique</div>
                            </div>

                            <div class="mb-3">
                                <label for="prix" class="form-label">Prix (€) *</label>
                                <input type="number" class="form-control" id="prix" th:field="*{prix}" 
                                       required min="0" step="0.01">
                                <div class="form-text">Prix en euros (Ex: 150.00)</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/prix-vol}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Retour
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
