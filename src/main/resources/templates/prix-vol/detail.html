<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Prix Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h3>Détails du Prix Vol</h3>
                        <div>
                            <a th:href="@{/prix-vol/{id}/edit(id=${prixVol.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i> Modifier
                            </a>
                            <a th:href="@{/prix-vol/{id}/delete(id=${prixVol.id})}" 
                               class="btn btn-danger"
                               onclick="return confirm('Supprimer ce prix ?')">
                                <i class="bi bi-trash"></i> Supprimer
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <h5 class="border-bottom pb-2 mb-3">Informations du Prix</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">ID</th>
                                        <td th:text="${prixVol.id}"></td>
                                    </tr>
                                    <tr>
                                        <th>Classe de Siège</th>
                                        <td>
                                            <span th:text="${prixVol.classeSiege.libelle}" 
                                                  th:classappend="${prixVol.classeSiege.libelle == 'BUSINESS' ? 'badge bg-warning' : 'badge bg-info'}">
                                            </span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>Prix</th>
                                        <td>
                                            <strong class="text-success fs-4" th:text="${#numbers.formatDecimal(prixVol.prix, 0, 'COMMA', 2, 'POINT')} + ' €'"></strong>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">Date Création</th>
                                        <td th:text="${#temporals.format(prixVol.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                    <tr>
                                        <th>Dernière Modif.</th>
                                        <td th:text="${#temporals.format(prixVol.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <h5 class="border-bottom pb-2 mb-3 mt-4">Informations du Vol</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">Numéro Vol</th>
                                        <td><strong th:text="${prixVol.vol.numeroVol}"></strong></td>
                                    </tr>
                                    <tr>
                                        <th>Départ</th>
                                        <td>
                                            <span class="badge bg-primary" th:text="${prixVol.vol.aeroportDepart.codeAeroport}"></span>
                                            <span th:text="${prixVol.vol.aeroportDepart.nom}"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>Arrivée</th>
                                        <td>
                                            <span class="badge bg-success" th:text="${prixVol.vol.aeroportArrivee.codeAeroport}"></span>
                                            <span th:text="${prixVol.vol.aeroportArrivee.nom}"></span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">Date Départ</th>
                                        <td th:text="${#temporals.format(prixVol.vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                    <tr>
                                        <th>Date Arrivée</th>
                                        <td th:text="${#temporals.format(prixVol.vol.dateHeureArrivee, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                    <tr>
                                        <th>Durée</th>
                                        <td>
                                            <span th:with="dureeMinutes=${T(java.time.Duration).between(prixVol.vol.dateHeureDepart, prixVol.vol.dateHeureArrivee).toMinutes()}"
                                                  th:text="${dureeMinutes / 60} + 'h ' + ${dureeMinutes % 60} + 'min'">
                                            </span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <a th:href="@{/prix-vol}" class="btn btn-secondary mt-3">
                            <i class="bi bi-arrow-left"></i> Retour à la liste
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
