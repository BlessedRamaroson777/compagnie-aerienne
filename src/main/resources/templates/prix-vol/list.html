<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prix et Revenus des Vols</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/modern-style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar('prix')}"></div>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-cash-stack"></i> Prix et Revenus des Vols</h1>
                </div>

                <!-- Formulaire de sélection du vol -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" action="/prix-vol">
                            <div class="row align-items-end">
                                <div class="col-md-10">
                                    <label for="volId" class="form-label fw-bold">Sélectionner un Vol (Route)</label>
                                    <select class="form-select" id="volId" name="volId" onchange="this.form.submit()">
                                        <option value="">-- Choisir un vol --</option>
                                        <option th:each="v : ${vols}" 
                                                th:value="${v.id}"
                                                th:selected="${volId != null && volId == v.id}"
                                                th:text="${v.numeroVol + ' - ' + v.aeroportDepart.codeAeroport + ' → ' + v.aeroportArrivee.codeAeroport + ' (' + v.aeroportDepart.ville + ' → ' + v.aeroportArrivee.ville + ')'}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-search"></i> Rechercher
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Résultats -->
                <div th:if="${vol != null}">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="bi bi-airplane"></i> Vol <span th:text="${vol.numeroVol}"></span> 
                                - <span th:text="${vol.aeroportDepart.ville + ' → ' + vol.aeroportArrivee.ville}"></span>
                            </h4>
                        </div>
                        <div class="card-body">
                            <div th:if="${volsProgrammesAvecRevenu.isEmpty()}" class="alert alert-warning">
                                <i class="bi bi-exclamation-triangle"></i> Aucun vol programmé trouvé pour ce vol.
                            </div>

                            <div th:unless="${volsProgrammesAvecRevenu.isEmpty()}">
                                <h5 class="mb-3">Vols Programmés et Revenus Potentiels</h5>
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover">
                                        <thead class="table-dark">
                                            <tr>
                                                <th width="15%">Date Départ</th>
                                                <th width="15%">Date Arrivée</th>
                                                <th width="15%">Avion</th>
                                                <th width="15%">Modèle</th>
                                                <th width="12%" class="text-center">Statut</th>
                                                <th width="18%" class="text-end">Revenu Maximum</th>
                                                <th width="10%" class="text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="vpr : ${volsProgrammesAvecRevenu}">
                                                <td th:text="${#temporals.format(vpr.volProgramme.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                                                <td th:text="${#temporals.format(vpr.volProgramme.dateHeureArrivee, 'dd/MM/yyyy HH:mm')}"></td>
                                                <td th:text="${vpr.volProgramme.avion.codeAvion}"></td>
                                                <td th:text="${vpr.volProgramme.avion.modelAvion.designation}"></td>
                                                <td class="text-center">
                                                    <span th:text="${vpr.volProgramme.status}"
                                                          th:classappend="${vpr.volProgramme.status.name() == 'PLANIFIE' ? 'badge bg-info' :
                                                                          (vpr.volProgramme.status.name() == 'EN_VOL' ? 'badge bg-primary' :
                                                                          (vpr.volProgramme.status.name() == 'TERMINE' ? 'badge bg-success' :
                                                                          (vpr.volProgramme.status.name() == 'ANNULE' ? 'badge bg-danger' : 'badge bg-warning')))}">
                                                    </span>
                                                </td>
                                                <td class="text-end">
                                                    <strong class="fs-5" th:classappend="${vpr.revenuTotal.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'text-danger' : 'text-success'}">
                                                        <span th:text="${#numbers.formatDecimal(vpr.revenuTotal, 0, 'COMMA', 2, 'POINT')}"></span> Ar
                                                    </strong>
                                                    <br>
                                                    <small class="text-muted" th:if="${vpr.revenuTotal.compareTo(T(java.math.BigDecimal).ZERO) == 0}">
                                                        <i class="bi bi-exclamation-circle"></i> Prix non définis
                                                    </small>
                                                </td>
                                                <td class="text-center">
                                                    <a th:href="@{/vols-programmes/{id}(id=${vpr.volProgramme.id})}" 
                                                       class="btn btn-sm btn-info" 
                                                       title="Voir détails et gérer prix">
                                                        <i class="bi bi-eye"></i>
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                        <tfoot class="table-success">
                                            <tr>
                                                <td colspan="5" class="text-end fw-bold fs-5">REVENU MAXIMUM TOTAL (toutes places occupées) :</td>
                                                <td class="text-end">
                                                    <h4 class="mb-0 text-success fw-bold">
                                                        <span th:text="${#numbers.formatDecimal(#aggregates.sum(volsProgrammesAvecRevenu.![revenuTotal]), 0, 'COMMA', 2, 'POINT')}"></span> Ar
                                                    </h4>
                                                </td>
                                                <td></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
