<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prix des Vols</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/modern-style.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar('prix')}"></div>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="bi bi-cash-stack"></i> Prix des Vols par Classe</h1>
                    <a th:href="@{/prix-vol/new}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Nouveau Prix
                    </a>
                </div>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Vol</th>
                                    <th>Départ → Arrivée</th>
                                    <th>Date/Heure Départ</th>
                                    <th>Classe</th>
                                    <th>Prix</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prix : ${prixVols}">
                                    <td th:text="${prix.id}"></td>
                                    <td>
                                        <strong th:text="${prix.vol.numeroVol}"></strong>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary" th:text="${prix.vol.aeroportDepart.codeAeroport}"></span>
                                        →
                                        <span class="badge bg-success" th:text="${prix.vol.aeroportArrivee.codeAeroport}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(prix.vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span th:text="${prix.classeSiege.libelle}" 
                                              th:classappend="${prix.classeSiege.libelle == 'BUSINESS' ? 'badge bg-warning' : 'badge bg-info'}">
                                        </span>
                                    </td>
                                    <td>
                                        <strong th:text="${#numbers.formatDecimal(prix.prix, 0, 'COMMA', 2, 'POINT')} + ' €'"></strong>
                                    </td>
                                    <td>
                                        <a th:href="@{/prix-vols/{id}(id=${prix.id})}" class="btn btn-sm btn-info">
                                            <i class="bi bi-eye"></i> Voir
                                        </a>
                                        <a th:href="@{/prix-vols/{id}/edit(id=${prix.id})}" class="btn btn-sm btn-secondary">
                                            <i class="bi bi-pencil"></i> Modifier
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
