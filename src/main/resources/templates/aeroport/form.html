<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${aeroport.id != null ? 'Modifier Aéroport' : 'Nouvel Aéroport'}">Aéroport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${aeroport.id != null ? 'Modifier Aéroport' : 'Nouvel Aéroport'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${aeroport.id != null ? '/aeroports/' + aeroport.id : '/aeroports'}}" 
                              th:object="${aeroport}" method="post">
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="codeAeroport" class="form-label">Code IATA *</label>
                                    <input type="text" class="form-control" id="codeAeroport" th:field="*{codeAeroport}" 
                                           required maxlength="3" style="text-transform: uppercase;">
                                    <div class="form-text">3 lettres (Ex: CDG, JFK, DXB)</div>
                                </div>
                                
                                <div class="col-md-8 mb-3">
                                    <label for="nom" class="form-label">Nom de l'Aéroport *</label>
                                    <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
                                    <div class="form-text">Ex: Aéroport Charles de Gaulle</div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="ville" class="form-label">Ville *</label>
                                    <input type="text" class="form-control" id="ville" th:field="*{ville}" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="pays" class="form-label">Pays *</label>
                                    <input type="text" class="form-control" id="pays" th:field="*{pays}" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/aeroports}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Retour
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
