<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion Vol Programme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            
            <main class="col-md-10 ms-sm-auto px-md-4">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-arrow-left-right"></i> Diffusion Vol Programme</h1>
                <a th:href="@{/diffusion-vol-programme/form}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvelle diffusion vol
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Diffusion Société</th>
                                    <th>Vol</th>
                                    <th>Départ</th>
                                    <th>Arrivée</th>
                                    <th>Nombre</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(diffusionsVol)}">
                                    <td colspan="7" class="text-center text-muted">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        Aucune diffusion vol enregistrée
                                    </td>
                                </tr>
                                <tr th:each="diffusion : ${diffusionsVol}">
                                    <td th:text="${diffusion.idDiffusionVolProgramme}"></td>
                                    <td th:text="${diffusion.diffusionSociete?.idDiffusionSociete}"></td>
                                    <td th:text="${diffusion.volProgramme?.vol?.numeroVol}"></td>
                                    <td th:text="${diffusion.volProgramme?.vol?.aeroportDepart?.nom}"></td>
                                    <td th:text="${diffusion.volProgramme?.vol?.aeroportArrivee?.nom}"></td>
                                    <td th:text="${diffusion.nombre}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/diffusion-vol-programme/detail/{id}(id=${diffusion.idDiffusionVolProgramme})}" 
                                           class="btn btn-sm btn-outline-info" title="Détails">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/diffusion-vol-programme/form/{id}(id=${diffusion.idDiffusionVolProgramme})}" 
                                           class="btn btn-sm btn-outline-primary" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/diffusion-vol-programme/delete/{id}(id=${diffusion.idDiffusionVolProgramme})}" 
                                           class="btn btn-sm btn-outline-danger" title="Supprimer"
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette diffusion vol ?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
