<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Diffusions Vol Programme</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-plane me-2"></i>Diffusions Vol Programme</h4>
                <a th:href="@{/diffusion-vol-programme/form}" class="btn btn-light"><i class="fas fa-plus me-2"></i>Nouvelle</a>
            </div>
            <div class="card-body">
                <table class="table table-hover table-sm">
                    <thead>
                        <tr><th>ID</th><th>Diffusion</th><th>Vol</th><th>Nombre</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="diff : ${diffusionsVol}">
                            <td th:text="${diff.idDiffusionVolProgramme}"></td>
                            <td th:text="${diff.diffusionSociete?.societe?.libelle}"></td>
                            <td th:text="${diff.volProgramme?.vol?.numeroVol}"></td>
                            <td th:text="${diff.nombre}"></td>
                            <td>
                                <a th:href="@{/diffusion-vol-programme/detail/{id}(id=${diff.idDiffusionVolProgramme})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
                                <a th:href="@{/diffusion-vol-programme/form/{id}(id=${diff.idDiffusionVolProgramme})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/diffusion-vol-programme/delete/{id}(id=${diff.idDiffusionVolProgramme})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmer?')"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
