<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Formulaire Diffusion</title></head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-broadcast-tower me-2"></i>Diffusion Société</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/diffusion-societe/save}" th:object="${diffusion}" method="post">
                    <input type="hidden" th:field="*{idDiffusionSociete}">
                    <div class="mb-3">
                        <label class="form-label">Société</label>
                        <select name="societeId" class="form-select" required>
                            <option value="">Sélectionner...</option>
                            <option th:each="soc : ${societes}" th:value="${soc.idSociete}" 
                                    th:text="${soc.libelle}"
                                    th:selected="${diffusion.societe != null && diffusion.societe.idSociete == soc.idSociete}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="number" th:field="*{nombre}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" th:field="*{date}" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Enregistrer</button>
                    <a th:href="@{/diffusion-societe}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
