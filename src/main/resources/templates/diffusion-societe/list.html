<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusions Société</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <div class="main-content-with-sidebar">
        <div class="container-fluid py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-broadcast-tower"></i> Diffusions Société</h1>
                <a th:href="@{/diffusion-societe/form}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nouvelle diffusion
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Société</th>
                                    <th>Nombre</th>
                                    <th>Date</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(diffusions)}">
                                    <td colspan="5" class="text-center text-muted">
                                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                        Aucune diffusion enregistrée
                                    </td>
                                </tr>
                                <tr th:each="diffusion : ${diffusions}">
                                    <td th:text="${diffusion.idDiffusionSociete}"></td>
                                    <td th:text="${diffusion.societe?.libelle}"></td>
                                    <td th:text="${diffusion.nombre}"></td>
                                    <td th:text="${#temporals.format(diffusion.date, 'dd/MM/yyyy')}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/diffusion-societe/detail/{id}(id=${diffusion.idDiffusionSociete})}" 
                                           class="btn btn-sm btn-outline-info" title="Détails">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/diffusion-societe/form/{id}(id=${diffusion.idDiffusionSociete})}" 
                                           class="btn btn-sm btn-outline-primary" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/diffusion-societe/delete/{id}(id=${diffusion.idDiffusionSociete})}" 
                                           class="btn btn-sm btn-outline-danger" title="Supprimer"
                                           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette diffusion ?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
