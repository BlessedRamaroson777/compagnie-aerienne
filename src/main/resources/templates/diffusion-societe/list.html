<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Diffusions Société</title></head>
<body>
<div layout:fragment="content">
    <div class="container-fluid mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-broadcast-tower me-2"></i>Diffusions Société</h4>
                <a th:href="@{/diffusion-societe/form}" class="btn btn-light"><i class="fas fa-plus me-2"></i>Nouvelle Diffusion</a>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr><th>ID</th><th>Société</th><th>Nombre</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="diffusion : ${diffusions}">
                            <td th:text="${diffusion.idDiffusionSociete}"></td>
                            <td th:text="${diffusion.societe?.libelle}"></td>
                            <td th:text="${diffusion.nombre}"></td>
                            <td th:text="${#temporals.format(diffusion.date, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <a th:href="@{/diffusion-societe/detail/{id}(id=${diffusion.idDiffusionSociete})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
                                <a th:href="@{/diffusion-societe/form/{id}(id=${diffusion.idDiffusionSociete})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/diffusion-societe/delete/{id}(id=${diffusion.idDiffusionSociete})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmer?')"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
