<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modelAvion.id != null ? 'Modifier Modèle' : 'Nouveau Modèle'}">Modèle Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${modelAvion.id != null ? 'Modifier Modèle d\'Avion' : 'Nouveau Modèle d\'Avion'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${modelAvion.id != null ? '/modeles-avion/' + modelAvion.id : '/modeles-avion'}}" 
                              th:object="${modelAvion}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="designation" class="form-label">Désignation *</label>
                                    <input type="text" class="form-control" id="designation" th:field="*{designation}" required>
                                    <div class="form-text">Ex: Boeing 737-800</div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="fabricant" class="form-label">Fabricant *</label>
                                    <input type="text" class="form-control" id="fabricant" th:field="*{fabricant}" required>
                                    <div class="form-text">Ex: Boeing, Airbus</div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="capacite" class="form-label">Capacité (passagers) *</label>
                                    <input type="number" class="form-control" id="capacite" th:field="*{capacite}" required min="1">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="autonomieKm" class="form-label">Autonomie (km) *</label>
                                    <input type="number" class="form-control" id="autonomieKm" th:field="*{autonomieKm}" required min="1">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="vitesseKmH" class="form-label">Vitesse (km/h) *</label>
                                    <input type="number" class="form-control" id="vitesseKmH" th:field="*{vitesseKmH}" required min="1">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
                                <div class="form-text">Informations complémentaires sur le modèle</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/modeles-avion}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Retour
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
