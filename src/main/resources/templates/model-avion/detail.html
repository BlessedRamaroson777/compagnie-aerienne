<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Modèle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h3>Détails du Modèle d'Avion</h3>
                        <div>
                            <a th:href="@{/modeles-avion/{id}/edit(id=${modelAvion.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i> Modifier
                            </a>
                            <a th:href="@{/modeles-avion/{id}/delete(id=${modelAvion.id})}" 
                               class="btn btn-danger"
                               onclick="return confirm('Supprimer ce modèle ?')">
                                <i class="bi bi-trash"></i> Supprimer
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">ID</th>
                                        <td th:text="${modelAvion.id}"></td>
                                    </tr>
                                    <tr>
                                        <th>Désignation</th>
                                        <td><strong th:text="${modelAvion.designation}"></strong></td>
                                    </tr>
                                    <tr>
                                        <th>Fabricant</th>
                                        <td th:text="${modelAvion.fabricant}"></td>
                                    </tr>
                                    <tr>
                                        <th>Capacité</th>
                                        <td>
                                            <span class="badge bg-info" th:text="${modelAvion.capacite} + ' passagers'"></span>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-bordered">
                                    <tr>
                                        <th width="40%">Autonomie</th>
                                        <td th:text="${#numbers.formatInteger(modelAvion.autonomieKm, 0, 'COMMA')} + ' km'"></td>
                                    </tr>
                                    <tr>
                                        <th>Vitesse</th>
                                        <td th:text="${#numbers.formatInteger(modelAvion.vitesseKmH, 0, 'COMMA')} + ' km/h'"></td>
                                    </tr>
                                    <tr>
                                        <th>Créé le</th>
                                        <td th:text="${#temporals.format(modelAvion.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                    <tr>
                                        <th>Modifié le</th>
                                        <td th:text="${#temporals.format(modelAvion.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <div th:if="${modelAvion.description}" class="mt-3">
                            <h5>Description</h5>
                            <div class="alert alert-info">
                                <p th:text="${modelAvion.description}" style="white-space: pre-line; margin: 0;"></p>
                            </div>
                        </div>

                        <a th:href="@{/modeles-avion}" class="btn btn-secondary mt-3">
                            <i class="bi bi-arrow-left"></i> Retour à la liste
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
