<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${produit.idProduit != null ? 'Modifier' : 'Nouveau'} + ' Produit'">Produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="bi bi-box-seam"></i> 
                        <span th:text="${produit.idProduit != null ? 'Modifier le produit' : 'Nouveau produit'}"></span>
                    </h1>
                </div>

                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="@{/produit/save}" th:object="${produit}" method="post">
                                    <input type="hidden" th:field="*{idProduit}">
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Libellé <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{libelle}" required>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Stock <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" th:field="*{stock}" min="0" required>
                                            <small class="text-muted">Quantité en stock</small>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Prix (Ar) <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" th:field="*{prix}" min="0" step="0.01" required>
                                        </div>
                                    </div>
                                    
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-circle"></i> Enregistrer
                                        </button>
                                        <a th:href="@{/produit}" class="btn btn-secondary">
                                            <i class="bi bi-arrow-left"></i> Annuler
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Historique des prix -->
                    <div class="col-md-4" th:if="${historiquePrix != null && !historiquePrix.isEmpty()}">
                        <div class="card">
                            <div class="card-header">
                                <i class="bi bi-clock-history"></i> Historique des prix
                            </div>
                            <div class="card-body">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th class="text-end">Prix (Ar)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="hp : ${historiquePrix}">
                                            <td th:text="${#temporals.format(hp.dateModification, 'dd/MM/yyyy HH:mm')}"></td>
                                            <td class="text-end" th:text="${#numbers.formatDecimal(hp.prix, 0, 'COMMA', 2, 'POINT')}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
