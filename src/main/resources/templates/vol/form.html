<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vols}" th:object="${vol}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="numeroVol" class="form-label">Numéro de Vol *</label>
                                <input type="text" class="form-control" id="numeroVol" th:field="*{numeroVol}" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="depart" class="form-label">Départ *</label>
                                    <input type="text" class="form-control" id="depart" th:field="*{depart}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="arrivee" class="form-label">Arrivée *</label>
                                    <input type="text" class="form-control" id="arrivee" th:field="*{arrivee}" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="dateHeureDepart" class="form-label">Date/Heure Départ *</label>
                                    <input type="datetime-local" class="form-control" id="dateHeureDepart" th:field="*{dateHeureDepart}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dateHeureArrivee" class="form-label">Date/Heure Arrivée *</label>
                                    <input type="datetime-local" class="form-control" id="dateHeureArrivee" th:field="*{dateHeureArrivee}" required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="prixBase" class="form-label">Prix de Base (€) *</label>
                                    <input type="number" step="0.01" class="form-control" id="prixBase" th:field="*{prixBase}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="avionId" class="form-label">Avion *</label>
                                    <select class="form-select" id="avionId" name="avionId" required>
                                        <option value="">Sélectionnez un avion</option>
                                        <option th:each="avion : ${avions}" 
                                                th:value="${avion.id}"
                                                th:text="${avion.codeAvion + ' - ' + avion.modele}"
                                                th:selected="${vol.avion != null && vol.avion.id == avion.id}"></option>
                                    </select>
                                    <div class="form-text">Les sièges seront générés automatiquement</div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/vols}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
