<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <!-- Main Content -->
    <div class="main-content-with-sidebar">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vols}" th:object="${vol}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="numeroVol" class="form-label">Numéro de Vol *</label>
                                <input type="text" class="form-control" id="numeroVol" th:field="*{numeroVol}" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="aeroportDepart" class="form-label">Aéroport de Départ *</label>
                                    <select class="form-select" id="aeroportDepart" th:field="*{aeroportDepart}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="aeroport : ${aeroports}" 
                                                th:value="${aeroport.id}"
                                                th:text="${aeroport.codeAeroport + ' - ' + aeroport.nom + ' (' + aeroport.ville + ')'}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="aeroportArrivee" class="form-label">Aéroport d'Arrivée *</label>
                                    <select class="form-select" id="aeroportArrivee" th:field="*{aeroportArrivee}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="aeroport : ${aeroports}" 
                                                th:value="${aeroport.id}"
                                                th:text="${aeroport.codeAeroport + ' - ' + aeroport.nom + ' (' + aeroport.ville + ')'}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Durée du vol -->
                            <div class="mb-3">
                                <label class="form-label">Durée du Vol *</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="dureeHeures" min="0" max="24" value="0"
                                                   th:value="${vol.dureeVolMinutes != null ? vol.dureeVolMinutes / 60 : 0}">
                                            <span class="input-group-text">heures</span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="dureeMinutes" min="0" max="59" value="0"
                                                   th:value="${vol.dureeVolMinutes != null ? vol.dureeVolMinutes % 60 : 0}">
                                            <span class="input-group-text">minutes</span>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" th:field="*{dureeVolMinutes}" id="dureeVolMinutes">
                                <div class="form-text">Durée estimée du vol (utilisée pour calculer automatiquement l'heure d'arrivée)</div>
                            </div>
                            
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i> Un vol est une route (numéro de vol + aéroports + durée). Les dates et avions seront configurés dans les vols programmés. L'heure d'arrivée sera calculée automatiquement.
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/vols}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Valider que départ != arrivée
        document.querySelector('form').addEventListener('submit', function(e) {
            const depart = document.getElementById('aeroportDepart').value;
            const arrivee = document.getElementById('aeroportArrivee').value;
            
            if (depart && arrivee && depart === arrivee) {
                e.preventDefault();
                alert("L'aéroport de départ et d'arrivée doivent être différents!");
                return false;
            }
            
            // Calculer durée totale en minutes
            const heures = parseInt(document.getElementById('dureeHeures').value) || 0;
            const minutes = parseInt(document.getElementById('dureeMinutes').value) || 0;
            const totalMinutes = (heures * 60) + minutes;
            
            if (totalMinutes <= 0) {
                e.preventDefault();
                alert("Veuillez spécifier une durée de vol valide!");
                return false;
            }
            
            document.getElementById('dureeVolMinutes').value = totalMinutes;
        });
        
        // Mettre à jour le champ caché quand les valeurs changent
        function updateDuree() {
            const heures = parseInt(document.getElementById('dureeHeures').value) || 0;
            const minutes = parseInt(document.getElementById('dureeMinutes').value) || 0;
            document.getElementById('dureeVolMinutes').value = (heures * 60) + minutes;
        }
        
        document.getElementById('dureeHeures').addEventListener('change', updateDuree);
        document.getElementById('dureeMinutes').addEventListener('change', updateDuree);
    </script>
    </div><!-- closing main-content-with-sidebar -->
    </div><!-- closing page wrapper -->
</body>
</html>
