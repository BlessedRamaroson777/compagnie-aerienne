<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 th:text="${vol.id != null ? 'Modifier Vol' : 'Nouveau Vol'}">Formulaire Vol</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vols}" th:object="${vol}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="numeroVol" class="form-label">Numéro de Vol *</label>
                                <input type="text" class="form-control" id="numeroVol" th:field="*{numeroVol}" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="aeroportDepart" class="form-label">Aéroport de Départ *</label>
                                    <select class="form-select" id="aeroportDepart" th:field="*{aeroportDepart}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="aeroport : ${aeroports}" 
                                                th:value="${aeroport.id}"
                                                th:text="${aeroport.codeAeroport + ' - ' + aeroport.nom + ' (' + aeroport.ville + ')'}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="aeroportArrivee" class="form-label">Aéroport d'Arrivée *</label>
                                    <select class="form-select" id="aeroportArrivee" th:field="*{aeroportArrivee}" required>
                                        <option value="">-- Sélectionner --</option>
                                        <option th:each="aeroport : ${aeroports}" 
                                                th:value="${aeroport.id}"
                                                th:text="${aeroport.codeAeroport + ' - ' + aeroport.nom + ' (' + aeroport.ville + ')'}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i> Un vol est une route (numéro de vol + aéroports). Les dates, heures et avions seront configurés dans les vols programmés.
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/vols}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
