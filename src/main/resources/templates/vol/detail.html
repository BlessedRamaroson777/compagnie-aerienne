<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail Vol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3><i class="bi bi-airplane-engines"></i> Détails du Vol</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Informations du Vol</h5>
                        <dl class="row">
                            <dt class="col-sm-4">Numéro:</dt>
                            <dd class="col-sm-8" th:text="${vol.numeroVol}"></dd>
                            
                            <dt class="col-sm-4">Aéroport Départ:</dt>
                            <dd class="col-sm-8" th:text="${vol.aeroportDepart.codeAeroport + ' - ' + vol.aeroportDepart.nom + ' (' + vol.aeroportDepart.ville + ')'}"></dd>
                            
                            <dt class="col-sm-4">Aéroport Arrivée:</dt>
                            <dd class="col-sm-8" th:text="${vol.aeroportArrivee.codeAeroport + ' - ' + vol.aeroportArrivee.nom + ' (' + vol.aeroportArrivee.ville + ')'}"></dd>
                            
                            <dt class="col-sm-4">Date Départ:</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></dd>
                            
                            <dt class="col-sm-4">Date Arrivée:</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(vol.dateHeureArrivee, 'dd/MM/yyyy HH:mm')}"></dd>
                            
                            <dt class="col-sm-4">Prix Base:</dt>
                            <dd class="col-sm-8" th:text="${vol.prixBase + ' €'}"></dd>
                        </dl>
                    </div>
                    
                    <div class="col-md-6">
                        <h5>Avion</h5>
                        <dl class="row">
                            <dt class="col-sm-4">Code:</dt>
                            <dd class="col-sm-8" th:text="${vol.avion.codeAvion}"></dd>
                            
                            <dt class="col-sm-4">Modèle:</dt>
                            <dd class="col-sm-8" th:text="${vol.avion.modele}"></dd>
                            
                            <dt class="col-sm-4">Capacité:</dt>
                            <dd class="col-sm-8" th:text="${vol.avion.capaciteTotale}"></dd>
                        </dl>

                        <h5 class="mt-3">Statistiques</h5>
                        <dl class="row">
                            <dt class="col-sm-6">Sièges Totaux:</dt>
                            <dd class="col-sm-6" th:text="${vol.siegesVol.size()}"></dd>
                            
                            <dt class="col-sm-6">Réservations:</dt>
                            <dd class="col-sm-6" th:text="${vol.reservations.size()}"></dd>
                            
                            <dt class="col-sm-6">Membres Équipage:</dt>
                            <dd class="col-sm-6" th:text="${vol.equipages.size()}"></dd>
                        </dl>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/vols}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                    <div>
                        <a th:href="@{/vols/{id}/edit(id=${vol.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Modifier
                        </a>
                        <a th:href="@{/vols/{id}/delete(id=${vol.id})}" class="btn btn-danger" 
                           onclick="return confirm('Supprimer ce vol?')">
                            <i class="bi bi-trash"></i> Supprimer
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
