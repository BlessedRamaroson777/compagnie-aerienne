<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    
    <!-- Main Content -->
    <div class="main-content-with-sidebar">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3><i class="bi bi-person"></i> Détails du Client</h3>
            </div>
            <div class="card-body">
                <dl class="row">
                    <dt class="col-sm-3">ID:</dt>
                    <dd class="col-sm-9" th:text="${client.id}"></dd>
                    
                    <dt class="col-sm-3">Nom:</dt>
                    <dd class="col-sm-9" th:text="${client.nom}"></dd>
                    
                    <dt class="col-sm-3">Prénom:</dt>
                    <dd class="col-sm-9" th:text="${client.prenom}"></dd>
                    
                    <dt class="col-sm-3">Email:</dt>
                    <dd class="col-sm-9" th:text="${client.email}"></dd>
                    
                    <dt class="col-sm-3">Téléphone:</dt>
                    <dd class="col-sm-9" th:text="${client.telephone}"></dd>
                </dl>

                <h5 class="mt-4">Réservations (<span th:text="${client.reservations.size()}"></span>)</h5>
                <div class="table-responsive" th:if="${!#lists.isEmpty(client.reservations)}">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Vol</th>
                                <th>Date</th>
                                <th>Statut</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reservation : ${client.reservations}">
                                <td th:text="${reservation.volProgramme.vol.numeroVol}"></td>
                                <td th:text="${#temporals.format(reservation.volProgramme.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${reservation.statut == T(com.airline.airline_app.entity.enums.StatutReservation).CONFIRMEE ? 'bg-success' : 'bg-danger'}"
                                          th:text="${reservation.statut}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/reservations/{id}(id=${reservation.id})}" class="btn btn-sm btn-info">Voir</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/clients}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
                    <div>
                        <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Modifier
                        </a>
                        <a th:href="@{/clients/{id}/delete(id=${client.id})}" class="btn btn-danger" 
                           onclick="return confirm('Supprimer ce client?')">
                            <i class="bi bi-trash"></i> Supprimer
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
